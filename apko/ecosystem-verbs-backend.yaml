contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - ca-certificates-bundle
    - wolfi-baselayout
    - nodejs-22
    - ecosystem-verbs-backend@local

archs:
  - amd64
  - arm64

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  NODE_ENV: production
  NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/extra-ca-certificates.crt

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: node /usr/share/ecosystem-verbs-backend/dist/index.js

annotations:
  org.opencontainers.image.source: https://github.com/ethereum-optimism/actions
  org.opencontainers.image.title: ecosystem-verbs-backend

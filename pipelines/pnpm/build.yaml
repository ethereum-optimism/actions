name: Build a pnpm monorepo application from source.

needs:
  packages:
    - busybox
    - nodejs
    - corepack

inputs:
  nx-package:
    description: "Full nx package scope (e.g. @eth-optimism/actions-service)"
    required: true
  deploy-filter:
    description: "pnpm deploy --filter value"
    required: true
  output:
    description: "Package name used for the install directory under /usr/share/"
    required: true
  pnpm-version:
    description: "pnpm version to activate via corepack"
    default: "9.0.2"
  rm-paths:
    description: "Space-separated paths (relative to source root) to delete before building, e.g. stray .npmignore files that make `pnpm deploy` drop required bundles."
    default: ""

pipeline:
  - runs: |
      set -euo pipefail
      export NX_DAEMON=false
      for p in ${{inputs.rm-paths}}; do
        rm -f "$p"
      done
      corepack enable
      corepack prepare pnpm@${{inputs.pnpm-version}} --activate
      pnpm install --frozen-lockfile --ignore-scripts
      pnpm nx build ${{inputs.nx-package}}
      pnpm deploy --filter=${{inputs.deploy-filter}} --prod /tmp/deploy/${{inputs.output}}
      mkdir -p ${{targets.contextdir}}/usr/share/${{inputs.output}}
      cp -r /tmp/deploy/${{inputs.output}}/* ${{targets.contextdir}}/usr/share/${{inputs.output}}/
      find ${{targets.contextdir}}/usr/share/${{inputs.output}}/node_modules -type d -name '*musl*' -exec rm -rf {} + 2>/dev/null || true
      find ${{targets.contextdir}}/usr/share/${{inputs.output}}/node_modules -type f -name '*musl*.node' -delete 2>/dev/null || true

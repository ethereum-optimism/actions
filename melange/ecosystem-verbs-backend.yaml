package:
  name: ecosystem-verbs-backend
  version: "0.0.0"
  epoch: 0
  description: ecosystem-verbs-backend — Node service running the Actions SDK
  copyright:
    - license: MIT

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - nodejs-22
      - corepack
      - python-3
      - build-base

pipeline:
  - runs: |
      set -euo pipefail
      export NX_DAEMON=false
      corepack enable
      corepack prepare pnpm@9.0.0 --activate
      pnpm install --frozen-lockfile --ignore-scripts
      pnpm nx build @eth-optimism/actions-service
      pnpm deploy --filter=@eth-optimism/actions-service --prod /tmp/deploy/ecosystem-verbs-backend
      mkdir -p ${{targets.contextdir}}/usr/share/ecosystem-verbs-backend
      cp -r /tmp/deploy/ecosystem-verbs-backend/* ${{targets.contextdir}}/usr/share/ecosystem-verbs-backend/
      find ${{targets.contextdir}}/usr/share/ecosystem-verbs-backend/node_modules -type d -name '*musl*' -exec rm -rf {} + 2>/dev/null || true
      find ${{targets.contextdir}}/usr/share/ecosystem-verbs-backend/node_modules -type f -name '*musl*.node' -delete 2>/dev/null || true
